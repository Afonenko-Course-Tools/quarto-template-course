project:
  type: default
  render: [index.qmd]
  output-dir: _output
  resources: [./assets/**, "!materials/**", "!**/_*.qmd"]
profile:
  default: student
  group: [[student, full]]
course:
  id: course-practice
  validate: true
filters: [course-core, course-presentation]
course-presentation:
  mode: study
format:
  revealjs:
    theme: default
    show-notes: false
    slide-number: true
    revealjs-plugins: [course-navigation]
lang: ru
