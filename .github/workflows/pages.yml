name: Local documentation checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # node runtime
        with:
          node-version: '22'
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - name: Installed documentation and ready demos
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --output task.tar.gz https://github.com/go-task/task/releases/download/v3.54.0/task_linux_amd64.tar.gz
          curl --fail --location --output task_checksums.txt https://github.com/go-task/task/releases/download/v3.54.0/task_checksums.txt
          awk '$2 == "task_linux_amd64.tar.gz" {print $1 "  task.tar.gz"}' task_checksums.txt | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/task"
          tar -xzf task.tar.gz -C "$RUNNER_TEMP/task" task
          export PATH="$RUNNER_TEMP/task:$PATH"
          export TASK="$RUNNER_TEMP/task/task"
          cd "$GITHUB_WORKSPACE"
          task install
          task fetch
          task render
          task check
          python3 tests/fetch.py
