project:
  type: book
  output-dir: _output
  pre-render:
    - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
    - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  resources: [assets/**, "!materials/**", "!**/_*.qmd"]
profile:
  default: student
  group: [[student, full]]
course:
  id: p0-tasks
  validate: true
filters: [course-core, course-presentation , project-download]
course-presentation:
  mode: study
book:
  title: P0 tasks
  repo-url: https://github.com/example/five-parts
  repo-branch: feat/p0-consumer-proof
  repo-subdir: tasks
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - labs/01.qmd
    - plans/01.qmd
format:
  html:
    theme: cosmo
project-download:
  resources:
    starter: {path: materials/student}
    instructor: {path: materials/instructor, profiles: [full]}
