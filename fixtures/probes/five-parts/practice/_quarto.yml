project:
  type: default
  render:
  - index.qmd
  output-dir: _output
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  resources:
  - ./assets/**
  - '!materials/**'
  - '!**/_*.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
profile:
  default: student
  group:
  - - student
    - full
course:
  id: p0-practice
filters:
- course-core
- course-presentation
- reference-catalog
course-presentation:
  mode: study
format:
  revealjs:
    shift-heading-level-by: -1
    slide-level: 2
    navigation-mode: linear
    theme: default
    show-notes: false
    slide-number: true
    revealjs-plugins:
    - course-navigation
    footer: '[View source](https://github.com/example/five-parts/blob/main/practice/index.qmd)
      · [Report issue](https://github.com/example/five-parts/issues/new)'
reference-catalog:
  namespace: practice
