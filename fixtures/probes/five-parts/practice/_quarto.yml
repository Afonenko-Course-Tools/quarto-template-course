project:
  type: default
  render: [index.qmd]
  output-dir: _output
  pre-render:
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  resources: [./assets/**, "!materials/**", "!**/_*.qmd"]
profile:
  default: student
  group: [[student, full]]
course:
  id: p0-practice
  validate: true
filters: [course-core, course-presentation]
course-presentation:
  mode: study
format:
  revealjs:
    theme: default
    show-notes: false
    slide-number: true
    revealjs-plugins: [course-navigation]
    footer: '[View source](https://github.com/example/five-parts/blob/feat/p0-consumer-proof/practice/index.qmd) · [Report issue](https://github.com/example/five-parts/issues/new)'
