project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - ./assets/**
  - '!theory/**'
  - '!tasks/**'
  - '!practice/**'
  - '!lectures/**'
  - '!handbook/**'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format: html
website:
  title: Five-part P0 portal
  site-url: https://example.edu/courses/p0/
profile:
  default: student
  group:
  - - student
    - full
filters:
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Five-part P0
  exports:
    theory:
    - sec-theory
    tasks:
    - sec-tasks
    - sec-lab
    - sec-plan
    practice:
    - sec-practice
    lectures:
    - sec-lectures
    handbook:
    - sec-handbook
course-site:
  projects:
  - id: theory
    path: theory
    format: html
    mount: theory
  - id: tasks
    path: tasks
    format: html
    mount: tasks
  - id: practice
    path: practice
    format: revealjs
    mount: practice
  - id: lectures
    path: lectures
    format: revealjs
    mount: lectures
  - id: handbook
    path: handbook
    format: html
    mount: handbook
