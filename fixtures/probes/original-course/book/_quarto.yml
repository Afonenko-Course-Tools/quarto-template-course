project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: book
  output-dir: _book
  resources:
  - '!**/projects/**'
  - '!materials/**'
  - '!**/_control.qmd'
  - '!_generated/**'
  - '!_freeze/**'
  - '!.quarto/**'
book:
  title: Учебный курс
  sidebar:
    tools:
    - icon: house
      href: ../index.html#sec-course
      text: Навигация курса
  chapters:
  - index.qmd
  - topics/contracts/index.qmd
  - topics/contracts/demonstration.qmd
  - labs/01.qmd
format:
  html:
    theme:
    - cosmo
metadata-files:
- _bsu.yml
course-presentation:
  mode: study
lang: ru
course:
  id: course
filters:
- course-core
- course-presentation
- project-download
- reference-catalog
profile:
  default: student
  group:
  - - student
    - full
project-download:
  resources:
    exr-clamp-demo:
      path: projects/clamp/student
    exr-clamp-instructor:
      path: projects/clamp/student
      profiles:
      - full
    observations:
      path: materials/observations
reference-catalog:
  namespace: book
