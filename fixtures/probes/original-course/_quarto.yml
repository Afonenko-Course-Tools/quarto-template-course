project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - '!book/**'
  - '!lectures/**'
  - '!practice/**'
  - '!essay/**'
  - '!handouts/**'
  - '!examples/**'
  - '!fixtures/**'
  - '!tests/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!_freeze/**'
  - '!.quarto/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format: html
lang: ru
course:
  id: template-navigation
website:
  title: Учебный курс
  search: true
filters:
- course-core
- reference-catalog
reference-catalog:
  namespace: site
  publication:
    title: Учебный курс
  exports:
    site:
    - sec-course
    book:
    - sec-contracts
    - sec-contract-demo
    essay:
    - sec-essays
    - sec-utf8-policies
  imports:
    os:
      source: fixtures/external-reference.json
      namespace: book
      base-url: https://example.edu/os/
      style: external
profile:
  default: student
  group:
  - - student
    - full
course-site:
  projects:
  - id: book
    path: book
    format: html
    mount: book
  - id: lectures
    path: lectures
    format: revealjs
    mount: lectures
  - id: practice
    path: practice
    format: revealjs
    mount: practice
  - id: essay
    path: essay
    format: html
    mount: essay
  - id: handouts
    path: handouts
    format: pdf
    mount: handouts
