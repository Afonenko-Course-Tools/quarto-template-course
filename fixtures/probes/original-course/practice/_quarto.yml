project:
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  type: default
  output-dir: _output
  render:
  - '**/*.qmd'
format:
  revealjs:
    theme:
    - default
    hash: true
    slide-number: true
    menu: false
    pdf-separate-fragments: false
    revealjs-plugins:
    - course-navigation
    course-nav:
      sidebar: false
metadata-files:
- _bsu.yml
course-presentation:
  mode: study
lang: ru
number-sections: false
profile:
  default: student
  group:
  - - student
    - full
course:
  id: course-practice
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: practice
