import groovy.xml.XmlSlurper

def variants = ['correct', 'correctGenericException', 'replacement', 'unfinished', 'rejectTwoByte', 'rejectThreeByte', 'rejectFourByte', 'rejectEmpty',
                    'rejectReplacement', 'alwaysReject', 'emptyResult', 'mutatesSuccess', 'mutatesFailure', 'wrongException']
def prepareReports = tasks.register('prepareMutationReports') {
    doLast { delete layout.buildDirectory.dir('mutation') }
}
def checks = variants.collect { variant ->
    def fixture = sourceSets.create(variant) {
        java.srcDir("../tests/variants/${variant}")
    }
    tasks.register("grade${variant.capitalize()}", Test) {
        dependsOn prepareReports, tasks.named(fixture.classesTaskName), tasks.named('testClasses')
        testClassesDirs = sourceSets.test.output.classesDirs
        // В отдельном процессе проверяется только выбранная реализация.
        classpath = sourceSets.test.output + fixture.output + configurations.testRuntimeClasspath
        useJUnitPlatform()
        ignoreFailures = true
        timeout = java.time.Duration.ofSeconds(30)
        reports.junitXml.outputLocation = layout.buildDirectory.dir("mutation/${variant}")
        reports.html.required = false
        outputs.upToDateWhen { false }
    }
}
def grade = tasks.register('grade') {
    dependsOn checks
    doLast {
        variants.each { variant ->
            def reports = fileTree(layout.buildDirectory.dir("mutation/${variant}")).matching {
                include 'TEST-*.xml'
            }.files
            if (reports.empty) throw new GradleException("${variant}: набор тестов пуст")
            def counts = [tests: 0L, failures: 0L, errors: 0L, skipped: 0L]
            reports.each { report ->
                def suite = new XmlSlurper().parse(report)
                counts.keySet().each { key -> counts[key] += suite.attributes()[key].toString().toLong() }
            }
            if (variant.startsWith('correct')) {
                if (counts.tests == 0 || counts.failures + counts.errors + counts.skipped != 0)
                    throw new GradleException('Корректная реализация должна пройти все тесты без пропусков')
            } else if (counts.failures + counts.errors == 0) {
                throw new GradleException("Не обнаружено нарушение: ${variant}")
            }
            logger.lifecycle("${variant}: ${counts}")
        }
    }
}
tasks.named('test') { enabled = false; dependsOn grade }
