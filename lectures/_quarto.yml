project:
  type: default
  output-dir: _output
  render: ["**/*.qmd"]
format:
  revealjs:
    theme: [default]
    hash: true
    slide-number: true
    menu: false
    pdf-separate-fragments: false
    revealjs-plugins: [course-navigation]
    course-nav:
      sidebar: true
metadata-files: [_bsu.yml]
course-presentation:
  mode: lecture
lang: ru
number-sections: false

profile:
  default: student
  group: [[student, full]]

course:
  id: programming-lectures
  validate: true
filters: [course-core, course-presentation]
