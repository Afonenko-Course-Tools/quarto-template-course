project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - guide/*.qmd
    - extensions/*.qmd
    - catalog/*.qmd
  resources:
    - examples/**
    - assets/**
    - '!_generated/**'
    - '!_site*/**'
    - '!_extensions/**'
    - '!docs/**'
    - '!tools/**'
    - '!.demo-staging/**'
    - '!Taskfile.yml'
    - '!README.md'
  preview:
    watch-inputs: false
profile:
  default: full
course:
  view: full
filters: [course-core, course-presentation]
format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-tools:
      source: repo
lang: ru
website:
  title: Инструменты учебного курса Quarto
  repo-url: https://github.com/Afonenko-Course-Tools/quarto-template-course
  repo-branch: main
  repo-actions: [source]
  search: true
  navbar:
    left:
      - {href: guide/start.qmd, text: Начало работы}
      - {href: guide/model.qmd, text: Модель курса}
      - {href: extensions/index.qmd, text: Расширения}
      - {href: catalog/index.qmd, text: Примеры}
