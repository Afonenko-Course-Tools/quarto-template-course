project:
  type: website
  output-dir: .project-publish/native
  render: []
  resources:
    - ./assets/**
    - "!theory/**"
    - "!tasks/**"
    - "!lectures/**"
    - "!practice/**"
    - "!handbook/**"
    - "!book/**"
    - "!essay/**"
    - "!handouts/**"
    - "!examples/**"
    - "!fixtures/**"
    - "!tests/**"
    - "!docs/**"
    - "!_extensions/**"
    - "!_publication/**"
    - "!.project-publish/**"
    - "!_generated/**"
    - "!_site*/**"
  pre-render:
    - _extensions/Afonenko-Course-Tools/project-publish/entrypoints/pre.ts
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/owner-freeze.ts
  post-render: _extensions/Afonenko-Course-Tools/project-publish/entrypoints/post.ts
  preview:
    watch-inputs: false
    serve:
      cmd: "quarto run ../preview.ts --port {port} --host {host}"
      ready: "Публикация предпросмотр готов"
format: html
lang: ru
course:
  id: course-portal
website:
  title: Учебный курс
  search: true
filters: [course-core, reference-catalog]
reference-catalog:
  namespace: portal
  publication:
    title: Учебный курс
  exports:
    portal: [sec-portal]
    theory: [sec-theory]
    tasks: [sec-tasks, sec-lab, sec-plan, exr-compare, exr-evidence]
    lectures: [sec-lectures]
    practice: [sec-practice]
    handbook: [sec-handbook]
profile:
  default: student
  group: [[student, full]]
project-publish:
  portal: index.qmd
  output-dir: _site
  projects:
    theory: {path: theory, format: html}
    tasks: {path: tasks, format: html}
    lectures: {path: lectures, format: revealjs}
    practice: {path: practice, format: revealjs}
    handbook: {path: handbook, format: html}
  integrations:
    - _publication/prepare.ts
    - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/publication.ts
    - _publication/finish.ts
    - _publication/verify.ts
