project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  resources:
  - ./assets/**
  - '!theory/**'
  - '!tasks/**'
  - '!lectures/**'
  - '!practice/**'
  - '!handbook/**'
  - '!book/**'
  - '!essay/**'
  - '!handouts/**'
  - '!examples/**'
  - '!fixtures/**'
  - '!tests/**'
  - '!docs/**'
  - '!_extensions/**'
  - '!_generated/**'
  - '!_site*/**'
  - '!_freeze/**'
  - '!.quarto/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-site/entrypoints/post.ts
  preview:
    watch-inputs: false
format: html
lang: ru
course:
  id: course-portal
website:
  title: Учебный курс
  search: true
filters:
- course-core
- reference-catalog
reference-catalog:
  namespace: portal
  publication:
    title: Учебный курс
  exports:
    portal:
    - sec-portal
    theory:
    - sec-theory
    tasks:
    - sec-tasks
    - sec-lab
    - sec-plan
    - exr-compare
    - exr-evidence
    lectures:
    - sec-lectures
    practice:
    - sec-practice
    handbook:
    - sec-handbook
profile:
  default: student
  group:
  - - student
    - full
course-site:
  projects:
  - id: theory
    path: theory
    format: html
    mount: theory
  - id: tasks
    path: tasks
    format: html
    mount: tasks
  - id: lectures
    path: lectures
    format: revealjs
    mount: lectures
  - id: practice
    path: practice
    format: revealjs
    mount: practice
  - id: handbook
    path: handbook
    format: html
    mount: handbook
