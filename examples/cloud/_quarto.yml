project:
  type: default
  output-dir: _output
  render:
  - index.qmd
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
format: html
lang: ru
profile:
  default: student
  group:
  - - student
    - full
course:
  adapters:
  - cloud
  id: example-cloud
  view: student
filters:
- course-core
- course-cloud
- course-presentation
- reference-catalog
reference-catalog:
  namespace: cloud
