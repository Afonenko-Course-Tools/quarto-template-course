project:
  type: book
  output-dir: _book
  resources:
    - "!**/projects/**"
    - "!**/_control.qmd"
    - "!_generated/**"
book:
  title: Программирование
  chapters:
    - index.qmd
    - topics/contracts/index.qmd
    - topics/contracts/demonstration.qmd
    - labs/01.qmd
format:
  html:
    theme: [cosmo]
metadata-files: [_bsu.yml]
course-presentation:
  mode: study
lang: ru
course:
  schema: "1.1"
  id: programming
  validate: true
filters:
  - course-core
  - course-cloud
  - course-prairielearn
  - course-presentation

profile:
  default: student
  group: [[student, full]]
