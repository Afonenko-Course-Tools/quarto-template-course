project:
  pre-render:
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
    - _extensions/Afonenko-Course-Tools/project-download/entrypoints/pre.ts
  post-render:
    - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
    - _extensions/Afonenko-Course-Tools/project-download/entrypoints/post.ts
  type: book
  output-dir: _book
  resources:
    - "!**/projects/**"
    - "!materials/**"
    - "!**/_control.qmd"
    - "!_generated/**"
book:
  title: Учебный курс
  chapters:
    - index.qmd
    - topics/contracts/index.qmd
    - topics/contracts/demonstration.qmd
    - labs/01.qmd
format:
  html:
    theme: [cosmo]
metadata-files: [_bsu.yml]
course-presentation:
  mode: study
lang: ru
course:
  id: course
  validate: true
filters:
  - project-download
  - course-core
  - course-presentation

profile:
  default: student
  group: [[student, full]]

project-download:
  resources:
    exr-clamp-demo:
      path: projects/clamp/student
    exr-clamp-instructor:
      path: projects/clamp/student
      profiles: [full]
    observations:
      path: materials/observations
